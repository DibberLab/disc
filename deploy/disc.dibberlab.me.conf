# /etc/nginx/sites-available/disc
#
# Install this as the HTTP-only version, then let certbot add the TLS block:
#   certbot --nginx -d disc.dibberlab.me
# Do not hand-write the listen 443 block.

server {
    listen 80;
    listen [::]:80;
    server_name disc.dibberlab.me;

    client_max_body_size 2m;      # generous for a JSON restore, tight otherwise

    location / {
        proxy_pass http://127.0.0.1:8412;   # must match PORT_HOST in .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
